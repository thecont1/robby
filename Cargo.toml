[package]
name = "robby-compiler"
version = "0.1.0"
edition = "2021"
description = "A portable compiler for Robby visual composition scripts"
license = "MIT"

[lib]
name = "robby_compiler"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "robby"
path = "src/main.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
image = { version = "=0.25.8", default-features = false, features = ["bmp", "jpeg", "png"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.115"
sha2 = "=0.10.8"
wasm-bindgen = { version = "=0.2.92", optional = true }
zune-core = "=0.4.12"
zune-jpeg = "=0.4.21"
