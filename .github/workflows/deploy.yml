name: Deploy to Cloudflare

on:
  push:
    branches: [main, dev/harleen]
  workflow_dispatch:

concurrency:
  group: deploy-robby
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Worker bundling needs node_modules (@cloudflare/containers).
      - run: corepack enable && corepack pnpm install --frozen-lockfile

      # dist/public must exist before wrangler deploy — it is the assets
      # directory uploaded for edge serving (SPA, deck, demo, gallery).
      - name: Build web assets
        run: corepack pnpm run build:web

      # wrangler deploy builds the Dockerfile image (Rust + web + gallery from
      # the checkout), pushes it to registry.cloudflare.com, updates the
      # container application, and uploads the Worker.
      - name: Deploy Worker + container image
        run: corepack pnpm dlx wrangler@4.95.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f6c75ebdcbc7447c7e7748b803c1c2f

      # The demo MP4 exceeds the 25 MiB asset limit, so it lives in R2 and the
      # Worker streams it from there. Re-upload on every deploy — pushing an
      # updated video to the repo is all that's needed.
      - name: Upload demo video to R2
        run: corepack pnpm dlx wrangler@4.95.0 r2 object put robby-media/robby-demo.mp4 --file dist/public/demo/robby-demo.mp4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f6c75ebdcbc7447c7e7748b803c1c2f
