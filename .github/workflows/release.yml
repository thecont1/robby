name: Build release binaries

# Build the robby / troid compiler on every platform we care about and attach
# the artifacts to a GitHub Release. Triggers on `v*` tag pushes (manual or
# release-please) and on manual dispatch for ad-hoc dry runs.
#
# Output filenames (so the menu link / docs can pin exact platform URLs):
#   robby-x86_64-unknown-linux-gnu.tar.gz     (Debian/Ubuntu, glibc)
#   robby-aarch64-unknown-linux-gnu.tar.gz    (ARM Linux servers, glibc)
#   robby-x86_64-apple-darwin.tar.gz          (Intel Macs)
#   robby-aarch64-apple-darwin.tar.gz         (Apple Silicon Macs)
#   robby-x86_64-pc-windows-msvc.zip          (Windows 64-bit)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Don't fight a release in progress; serialise.
concurrency:
  group: release-robby
  cancel-in-progress: false

permissions:
  contents: write  # required to create a release and upload assets

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin robby --bin troid

      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/robby"   staging/robby
          cp "target/${{ matrix.target }}/release/troid"   staging/troid || true
          cp README.md staging/README.md 2>/dev/null || true
          chmod +x staging/robby staging/troid 2>/dev/null || true

      - name: Pack archive
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          if [ "${{ matrix.ext }}" = "tar.gz" ]; then
            tar czf "../robby-${{ matrix.label }}.tar.gz" .
          else
            7z a "../robby-${{ matrix.label }}.zip" . >/dev/null
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: robby-${{ matrix.label }}
          path: robby-${{ matrix.label }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we have
        run: ls -la artifacts/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
